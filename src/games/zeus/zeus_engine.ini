; Pericles settings (zeus_engine.ini). Put this file next to ddraw.dll (the game folder). UTF-8.
; Pericles keeps its files (this file, the log, shots\) in its own folder: the game folder, or
; Documents\My Games\Pericles when the game folder cannot be written to without administrator rights (e.g. under
; Program Files); then this file is copied there once, at the first start, and the copy there is the one used.
; The debug panel (Insert) shows the folder and opens it.
; A missing file or setting means its default: "(default)" after one of the choices, or "Default: ...".
; These can also be changed in the debug panel (Insert, see [ui] below). Changes write only the values that change
; and keep everything else in this file (comments, blank lines, settings it does not know).

[video]
; emulated = our own DirectDraw: the desktop resolution is never changed, the game's picture (640x480, 800x600 or
;            1024x768, as chosen in the game) is scaled into a borderless fullscreen window with SDL3 (default)
; system   = the real Windows DirectDraw (real display mode changes), behind the logging wrapper; for comparison.
backend = emulated

; What puts the picture on the screen (emulated backend only). Takes effect after a restart.
; auto       = Direct3D 11, or Direct3D 9 if Direct3D 11 cannot start (default)
; direct3d   = Direct3D 9
; direct3d11 = Direct3D 11
renderer = auto

; How the picture is enlarged when the game's pixels are not the screen's (a display scale other than 100%,
; 1024x768, a window). At 100% in full screen the three look the same. Switches at once.
; sharp_bilinear = nearest pixels with a one-pixel blend at their edges: sharp, even, no blur (default)
; nearest        = plain nearest neighbor (uneven pixel sizes when the scale is not a whole number)
; linear         = smooth, softer
scaling = sharp_bilinear

; How often frames reach the screen (emulated backend only):
; display  = every screen refresh (vsync), from our own output thread; the game never waits for it (default)
; cap60    = like display, but at most 60 per second
; original = only for troubleshooting (not offered in the debug panel): as the game itself does it, at most ~20 per
;            second, shown from the game thread. The debug panel is not available with it; to go back, change this
;            line to display.
; The game's timing (simulation ticks, animations, scrolling) is the same in all three.
present = display

; The logical resolution the game draws (emulated backend only); the output scales it to the screen.
; scaled   = the screen's native resolution divided by the display scale below (default)
; 1024x768 = the game's own size
; WxH      = any size of at least 1024x768, e.g. 1920x1080, 1280x1024, 2560x1080 (black bars if the screen's
;            aspect differs); windowed, it becomes the window's size
; Menus and loading screens are shown as large as the city.
; In game, Shift+F7 cycles 1024x768 / scaled auto / scaled 100..250% until the game ends (this file is not changed).
; In Zeus, the game always starts in its own 1024x768 mode (also kept in Zeus.inf), so the game without this DLL
; starts at 1024x768 as well. F6 still switches the game to 800x600; F7 brings this resolution back.
resolution = scaled

; Display scale for resolution = scaled, 100..250 (percent, steps of 5):
; 100  = the sharpest picture: every pixel of the game is a pixel of the screen; small on a 4K screen (default)
; more = bigger but softer (the picture is enlarged); menus and loading screens too
; auto = the smallest scale that brings the height to 1080 or less (never below 768)
; Always limited so that the result stays at least 1024x768.
scale = 100

; The game's window. F5 or Alt+Enter switches while playing.
; fullscreen = covering the monitor, without a border (default)
; windowed   = a window you can move, size and maximize; the game is laid out again for its size when you let go
;              (its client area divided by the display scale, at least 1024x768)
window = fullscreen
; The window's client size, kept when you size it. Default: auto (three quarters of the monitor).
window_width = auto
window_height = auto
; The window's position, kept when you move it. Default: center (centered on its monitor).
window_x = center
window_y = center
; on  = windowed, the cursor cannot leave the window while it is the active one (released when you switch to
;       another program, minimize it or press F5). Its border cannot be reached then: switch this off to move or
;       size it.
; off = the cursor moves freely (default)
window_lock_cursor = off

; Loading screens (the pictures shown while a game loads), as large as the city:
; framed   = in a fret border, black around (default)
; original = the game's own picture, black around (as the game itself on a wide screen)
loading_screen = framed

; Menus, briefings, high scores, victory and defeat, as large as the city; what is around them:
; city     = a fret border, with a picture of your city blurred and darkened around:
;            menu_background.png (or .bmp) in Pericles's folder or the game folder if you put one there,
;            otherwise the city you saw last (kept as menu_background_auto.png); the game's panel pattern until
;            there is one (default)
; panel    = a fret border, on the game's own panel pattern
; framed   = a fret border, black around
; original = the game's own picture, black around (as the game itself on a wide screen)
; Clicks outside the picture do nothing.
menu_screens = city

; The picture of your city behind the menus (menu_screens = city):
; How much it is blurred, 0..8 (0 = not blurred). Default: 2.
background_blur = 2
; Its brightness, 30..100 (steps of 5), in percent of the city itself. Default: 65.
background_brightness = 65

[ui]
; The game's intro movie at start-up (takes effect the next time the game starts):
; play = as the game does it (default)
; skip = straight to the main menu
intro_movie = play

; The key that opens and closes the debug panel, for testing and finding problems, and for changing a setting when
; something goes wrong (also closed with Esc; the game pauses while it is open).
; Other examples: F12, Ctrl+F12, Shift+Alt+P, Home, ScrollLock, Backquote, Numpad0.
; Modifiers: Ctrl, Shift, Alt (e.g. Ctrl+Shift+F10); the hotkey only acts with exactly those modifiers.
; Keys: F1..F24, Insert, Delete, Home, End, PageUp, PageDown, Pause, ScrollLock, Tab, Space, Backquote,
;       A..Z, 0..9, Numpad0..Numpad9, NumpadAdd, NumpadSubtract, NumpadMultiply, NumpadDivide, NumpadDecimal.
; Two keys may be given, separated by a comma; the second is the alternative (e.g. Insert, Ctrl+F12).
; The key is kept from the game (also the character it types). Zeus uses Insert while typing text (e.g. a player
; name), which is then unavailable. Keys the game does not use: F9, F10, F11, F12, ScrollLock, Pause, Backquote.
; F5 and Alt+Enter switch between full screen and a window (see [video] window); the game's own F5 is not used.
; Default: Insert.
panel_key = Insert

; Size of the panel:
; auto     = the screen height divided by 1080 (1080p: 100%, 1440p: 133%, 2160p: 200%) (default)
; 100..300 = (percent, steps of 10) that size
; The panel is never taller than 80% of the screen; more content scrolls in it.
panel_scale = auto

; Where the building information window opens (right-click on a building); can be switched in the panel while
; playing and applies to the next window opened:
; original = as the game does it: below or above depending on where the cursor is, moved with the center of the city
; centered = in the middle of the city area
; cursor   = beside the cursor (right of it, or left near the sidebar), never past the edges of the city area (default)
info_window = cursor

[compat]
; For troubleshooting only. Which processors the game uses.
; auto     = the game's own threads stay where Windows puts them; Pericles's own work (putting the picture on the
;            screen, saving screenshots) runs on the other cores (default)
; original = everything stays where Windows put it, as without this setting. If the game crashes or the sound goes
;            wrong, try this to see whether this setting is the cause, and please report it with the log.
; Takes effect after a restart.
cpu_affinity = auto

[timing]
; on  = timeBeginPeriod(1) while the game runs: the game's timers then tick in 1 ms steps on every machine,
;       instead of 15.6 ms unless some other program has raised the resolution (default)
; off = leave the system timer resolution alone
high_resolution_timer = on

[gameplay]
; on  = ticks owed because a frame took long (large city, high resolution) are made up in the next frame (as
;       Augustus does), so the game runs at its set speed at any resolution (default)
; off = the game's own pace
keep_speed = on
; What game speed 100% means (other speeds are not affected):
; capped   = always the same pace, a step above 90% (90%: 45 steps a second, 100%: 62; as in Augustus) (default)
; original = the game's own 100%: as fast as the computer can draw, so it changes with the city and the resolution
;            (in a small city many times faster than 90%, in a large city on a big screen only a little faster)
full_speed = capped
; on  = the city goes on while the view scrolls (as in Augustus) (default)
; off = it stands still while scrolling (the original)
simulate_while_scrolling = on

; Smooth pixel scrolling of the city. No effect in Zeus.
; on  = smooth scrolling (default)
; off = the game's own scrolling
smooth_scroll = on

[debug]
; Saves two PNGs in shots\ in Pericles's folder (see the top of this file), both without our panel: the game's own picture at the resolution it
; draws (screen_0x00_game_1024x768_<time>.png) and what the screen shows (screen_0x00_screen-d3d11_2560x1440_<time>.png, with the renderer).
; The file names have the game's screen number, the resolution and the time; the log has one line per file.
; Same syntax as panel_key (e.g. Ctrl+F11). The game itself does not use F11. Default: F11.
screenshot_key = F11

; Problem report: when something odd is on the screen (e.g. flashing black blocks), press it right away. The
; log gets a mark (==== REPORT #n ====) and the game's statistics up to that moment; shots\ gets the picture shown
; and the screen (report<n>_screen_0x01_game_..., ..._screen_...). Same syntax
; as panel_key (e.g. Ctrl+F12). The game itself does not use F12. Default: F12.
report_key = F12

; Performance overlay: on = FPS, a graph of the time per main-loop pass and where the time goes (the game's
; simulation and drawing, our copies, the output) in the top left corner while playing. Switches at once.
; Default: off.
perf_overlay = off

; For development: on = the log lists what each screen draws (the pictures, by image file, with their area), the
; first time a screen is shown and with each problem report; the first frame of each screen is also saved in shots\.
; Read at start-up. Default: off.
draw_census = off

; For development: the city is drawn more often than the game was made for, and the extra drawings must not
; change the game. on = about once a second the log checks what one of them changed in the game's memory and
; whether all of it was put back. Slows the game a little. Read at start-up. Default: off.
state_check = off

; For tracking down flashing black blocks: on = the log records how Windows shows the game's frames (Direct3D 11
; only) and which programs known to draw on the screen are running (overlays, recorders, streaming). Only the log;
; the picture does not change. Read at start-up. Default: on.
present_mode_log = on

; For tracking down flashing black blocks: on = the game window's background becomes magenta. If the blocks flash
; magenta instead of black, press the report key and tell us. Magenta may also show for a moment when the window
; changes size. Switches at once. Default: off.
window_background_test = off

; For development: on = framed pictures in label colors, for checking their layout. Default: off.
frame_labels = off

; 0..5000: each of the five start-up loading screens stays on screen at least this many milliseconds, to look at or
; screenshot them (on a fast computer they flash by). 0 = as fast as the game loads. Read at start-up. Default: 0.
loading_stage_ms = 0
